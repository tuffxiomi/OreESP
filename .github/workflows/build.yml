name: Build Ore ESP

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure Android build
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          test -d "$ANDROID_NDK_HOME"

          xmake f \
            -p android \
            -a arm64-v8a \
            -m release \
            -y

      - name: Build Ore ESP
        shell: bash
        run: |
          xmake -y

      - name: Verify library
        shell: bash
        run: |
          LIB="build/android/arm64-v8a/release/libOreESP.so"

          if [ ! -f "$LIB" ]; then
            echo "ERROR: libOreESP.so was not produced."
            echo "Build directory:"
            find build -maxdepth 6 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "Built successfully:"
          ls -lh "$LIB"

      - name: Package levipack
        shell: bash
        run: |
          mkdir -p build/android/arm64-v8a/release

          python3 scripts/package_levipack.py \
            --library build/android/arm64-v8a/release/libOreESP.so \
            --icon assets/icon.png \
            --output build/android/arm64-v8a/release/OreESP.levipack

      - name: Verify levipack
        shell: bash
        run: |
          PACK="build/android/arm64-v8a/release/OreESP.levipack"

          if [ ! -f "$PACK" ]; then
            echo "ERROR: OreESP.levipack was not produced."
            exit 1
          fi

          echo "Package created successfully:"
          ls -lh "$PACK"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OreESP
          if-no-files-found: error
          path: |
            build/android/arm64-v8a/release/libOreESP.so
            build/android/arm64-v8a/release/OreESP.levipack
