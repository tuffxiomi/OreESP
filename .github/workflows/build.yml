name: Build Ore ESP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Setup xmake
        uses: xmake-io/github-action@v1
        with:
          xmake-version: latest

      - name: Build
        shell: bash
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          xmake f -p android -a arm64-v8a -m release -y
          xmake -y

      - name: Package levipack
        shell: bash
        run: |
          python3 scripts/package_levipack.py \
            --library build/android/arm64-v8a/release/libOreESP.so \
            --icon assets/icon.png \
            --output build/android/arm64-v8a/release/OreESP.levipack

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OreESP
          path: |
            build/android/arm64-v8a/release/libOreESP.so
            build/android/arm64-v8a/release/OreESP.levipack
